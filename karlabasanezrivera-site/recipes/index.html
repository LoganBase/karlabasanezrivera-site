<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — Karla Basanez Rivera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ivory:    #f4f1ea;
      --slate:    #708090;
      --silver:   #a8a9ad;
      --midnight: #191970;
      --silver-rule: rgba(168,169,173,0.4);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'EB Garamond', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ivory);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px 5vw;
    }
    .back {
      position: fixed; top: 24px; left: 32px;
      font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--slate); text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      transition: color 0.3s ease;
    }
    .back:hover { color: var(--midnight); }
    .back::before { content: '←'; font-size: 1rem; }
    .label {
      font-size: 0.7rem; letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--silver); margin-bottom: 20px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 300; font-style: italic;
      color: var(--midnight); margin-bottom: 24px;
    }
    .rule { width: 48px; height: 1px; background: var(--silver); margin: 0 auto 24px; }
    p {
      font-size: 1.05rem; color: var(--slate);
      max-width: 420px; line-height: 1.8;
    }
  </style>
</head>
<body>
  <a href="/" class="back">All Projects</a>
  <p class="label">Coming Soon</p>
  <h1>New Project</h1>
  <div class="rule"></div>
  <p>This project is currently in development. Check back soon.</p>
</body>
</html>
